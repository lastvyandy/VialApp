name: Import public Freedoom pickup sample
on:
  push:
    paths:
      - '.github/workflows/import-freedoom-sample.yml'
permissions:
  contents: read
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - name: Read public upstream WAV
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/freedoom/freedoom/e61c4f86722259ba9f410567156d958c712584a2/sounds/dsitemup.wav' -o /tmp/itemup.wav
          test "$(git hash-object /tmp/itemup.wav)" = "2a6510d136aeadc6fc88f9b4d398023a151f5695"
          printf 'FREEDOOM_ITEMUP_BASE64='
          base64 -w0 /tmp/itemup.wav
          printf '\n'
