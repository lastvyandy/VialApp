name: Android build and unit tests
on:
  push:
    branches: [master]
    paths: ['app/**', 'tools/doom-smoke.kt', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android-tests.yml']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rally-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run headless rally simulation
        shell: bash
        run: |
          kotlinc app/src/main/java/cl/vialapp/app/ui/games/rally/RallyEngine.kt tools/rally-smoke.kt -include-runtime -d "$RUNNER_TEMP/rally-smoke.jar"
          java -jar "$RUNNER_TEMP/rally-smoke.jar"
  doom-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run headless shooter simulation
        shell: bash
        run: |
          kotlinc app/src/main/java/cl/vialapp/app/ui/games/doom/DoomEngine.kt tools/doom-smoke.kt -include-runtime -d "$RUNNER_TEMP/doom-smoke.jar"
          java -jar "$RUNNER_TEMP/doom-smoke.jar"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          # Compile against the stable Android SDK used by local and CI builds.
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            "$SDKMANAGER" "platforms;android-36"
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/test-results/testDebugUnitTest/
